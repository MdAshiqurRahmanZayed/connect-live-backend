[project]
name = "connect-live-backend"
version = "0.1.0"
description = "Connect Live Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.7",
    "django-cors-headers>=4.9.0",
    "django-filter>=25.2",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "psycopg2-binary>=2.9.11",
    "python-decouple>=3.8",
    "django-extensions>=4.1",
    "boto3>=1.41.2",
    "django-storages>=1.14.6",
    "requests>=2.32.5",
    "pillow>=12.0.0",
]

[dependency-groups]
debug = [
    "django-silk>=5.4.3",
    "drf-yasg>=1.21.11",
]
test = [
    "pytest-django>=4.11.1",
    "factory-boy>=3.3.3",
    "faker>=37.11.0",
]
lint = [
    "ruff>=0.14.1",
    "pre-commit>=4.3.0",
]
local = [
    {include-group = "debug"},
    {include-group = "lint"},
    {include-group = "test"},
    "localstack>=4.10.0",
    "gunicorn>=23.0.0",
]
dev = [
    "gunicorn>=23.0.0",
    {include-group = "debug"},
]
production = [
    "gunicorn>=23.0.0"
]
